apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-deployment
  namespace: akdev
  labels:
    app: webapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapi
  template:
    metadata:
      labels:
        app: webapi
    spec:
      containers:
      - name: webapi
        image: saviacr2025.azurecr.io/akdev:$(Build.BuildId)
        ports:
        - containerPort: 80
        env:
        - name: ConnectionStrings__dbcn
          valueFrom:
            secretKeyRef:
              name: sql-secret
              key: dbcn