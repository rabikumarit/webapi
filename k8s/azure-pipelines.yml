# azure-pipelines.yml
trigger:
  branches:
    include:
      - dev

variables:
  imageName: 'akdev'
  acrName: 'saviacr2025.azurecr.io'
  tag: '$(Build.BuildId)'

stages:
- stage: BuildAndPush
  jobs:
  - job: Build
    displayName: Build and Push Docker Image
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and Push
      inputs:
        containerRegistry: 'rabikumarit'  # <-- This is your Service Connection Name
        repository: '$(imageName)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)

- stage: Deploy
  dependsOn: BuildAndPush
  jobs:
  - job: DeployToAks
    displayName: Deploy to AKS
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Kubernetes@1
      displayName: Set AKS context
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'rabikumarit'  # <-- Match your Service Connection name exactly
        azureResourceGroup: 'RG1'
        kubernetesCluster: 'MyAKSCluster'  # <-- Your actual AKS name
        command: 'login'

    - script: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/secret.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
      displayName: Deploy K8s YAMLs
