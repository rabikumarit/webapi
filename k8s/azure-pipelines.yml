# azure-pipelines.yml
trigger:
  branches:
    include:
      - dev

variables:
  imageName: 'akdev'
  acrName: 'saviacr2025.azurecr.io'
  tag: '$(Build.BuildId)'

stages:
- stage: BuildAndPush
  jobs:
  - job: Build
    displayName: Build and Push Docker Image
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: Build and Push
      inputs:
        containerRegistry: 'rabikumarit'  # <-- ACR Service Connection name
        repository: '$(imageName)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'  # Assuming it's at repo root; update path if needed
        tags: |
          $(tag)

- stage: Deploy
  dependsOn: BuildAndPush
  jobs:
  - job: DeployToAks
    displayName: Deploy to AKS
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: Set AKS context
      inputs:
        azureSubscription: 'rabikumarit'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az aks get-credentials --resource-group RG1 --name MyAKSCluster --overwrite-existing

    - script: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/secret.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
      displayName: Deploy K8s YAMLs
