trigger:
  branches:
    include:
      - dev

variables:
  imageName: 'akdev'
  azureContainerRegistry: 'saviacr2025.azurecr.io'
  kubernetesNamespace: 'akdev'
  dockerfilePath: 'Dockerfile'
  kubernetesManifestPath: 'manifests'

stages:
- stage: Build
  jobs:
  - job: BuildAndPush
    pool:
      name: Default  # 👈 Self-hosted agent pool name
      demands:
        - Agent.Name -equals DESKTOP-OML1U2C  # 👈 Your local agent name

    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Build and Push Docker image'
      inputs:
        command: buildAndPush
        repository: $(azureContainerRegistry)/$(imageName)
        dockerfile: $(dockerfilePath)
        tags: |
          $(Build.BuildId)

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployToAKS
    pool:
      name: Default  # 👈 Self-hosted agent pool name
      demands:
        - Agent.Name -equals DESKTOP-OML1U2C

    steps:
    - task: Kubernetes@1
      displayName: 'Set AKS context'
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '<your-service-connection-name>'  # 👈 Update this with your actual Azure DevOps service connection name
        azureResourceGroup: 'RG1'
        kubernetesCluster: 'MyAKSCluster'
        namespace: $(kubernetesNamespace)

    - task: KubernetesManifest@0
      displayName: 'Deploy Kubernetes manifests'
      inputs:
        action: deploy
        manifests: |
          $(kubernetesManifestPath)/deployment.yaml
          $(kubernetesManifestPath)/service.yaml
        containers: |
          $(azureContainerRegistry)/$(imageName):$(Build.BuildId)
