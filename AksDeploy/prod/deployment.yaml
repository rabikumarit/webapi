apiVersion: apps/v1
kind: Deployment
metadata:
  name: akprod-deployment
  labels:
    app: akprod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: akprod
  template:
    metadata:
      labels:
        app: akprod
    spec:
      containers:
      - name: akprod
        image: saviacr2025.azurecr.io/akprod:v1
        ports:
        - containerPort: 80
