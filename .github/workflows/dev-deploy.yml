name: Dev Deployment

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      run: az aks get-credentials --resource-group RG1 --name MyAKSCluster

    - name: Deploy to AKS
      run: |
        kubectl apply -f manifests/deployment-dev.yaml --namespace akdev
        kubectl apply -f manifests/service-dev.yaml --namespace akdev
